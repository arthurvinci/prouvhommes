name: CI

# Push to main, plus every PR. Without `branches` under push, each PR ran
# every job twice.
#
# The workflow always runs; each job decides from the changed paths whether it
# has work to do. A workflow skipped by `paths-ignore` never reports its
# checks, which leaves the required checks of the "Protect main" ruleset
# pending forever. A job skipped by `if:` reports "skipped", which they accept.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    outputs:
      texte: ${{ steps.filter.outputs.texte }}
      lean: ${{ steps.filter.outputs.lean }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/**'
            texte:
              - *workflow
              - 'texte/**'
              - 'scripts/build-pdf.sh'
              - 'scripts/check-pdf.sh'
              - 'scripts/texte-fingerprint.sh'
            # The text's \lean{} and \theoreme{} citations are checked by Lean.
            lean:
              - *workflow
              - 'lean/**'
              - 'texte/**'
              - 'scripts/check-sorry.sh'
              - 'scripts/check-renvois.sh'
            # The site reads texte/ and lean/ at build time, and its tests
            # check that every Lean name cited by the text exists.
            site:
              - *workflow
              - 'site/**'
              - 'texte/**'
              - 'lean/**'

  texte:
    name: Texte (LaTeX)
    needs: changes
    if: needs.changes.outputs.texte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The committed PDF carries the fingerprint of the sources it was built
      # from: catches a commit without the hook, or a merge made on GitHub.
      - name: PDF versionné à jour
        run: ./scripts/check-pdf.sh
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: texte
      - uses: actions/upload-artifact@v4
        with:
          name: prouvhommes-pdf
          path: texte/main.pdf

  lean:
    name: Formalisation (Lean)
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La toolchain et la révision de Mathlib sont épinglées dans le dépôt
      # (lean/lean-toolchain, lean/lake-manifest.json). Pour les changer :
      # scripts/update-mathlib.sh, en local.
      - name: Aucun sorry
        run: ./scripts/check-sorry.sh
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      # Every name the text cites exists; every cited theorem is proved
      # without sorry or non-standard axioms.
      - name: Renvois du texte vers Lean
        run: ./scripts/check-renvois.sh

  # Vercel deploys the site; this job runs its tests, which Vercel does not.
  site:
    name: Site (tests et build)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
