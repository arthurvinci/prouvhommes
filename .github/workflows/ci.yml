name: CI

on:
  push:
  pull_request:

jobs:
  texte:
    name: Texte (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: texte
      - uses: actions/upload-artifact@v4
        with:
          name: prouvhommes-pdf
          path: texte/main.pdf

  lean:
    name: Formalisation (Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La toolchain et la révision de Mathlib sont épinglées dans le dépôt
      # (lean/lean-toolchain, lean/lake-manifest.json). Pour les changer :
      # scripts/update-mathlib.sh, en local.
      - name: Aucun sorry
        run: ./scripts/check-sorry.sh
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
